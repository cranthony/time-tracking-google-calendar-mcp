name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A newer push to the same PR makes an older run moot.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-test:
    # The server's (rust/) own tests.
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --locked
        working-directory: rust

  rust-conformance:
    # The conformance scenarios (conformance/) against the server: run over
    # MCP against a fake Google, and compared with their golden records.
    name: conformance (Rust server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: cargo build --locked
        working-directory: rust
      - run: python -m pytest -q -n auto
