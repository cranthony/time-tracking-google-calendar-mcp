name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install -r requirements-dev.txt

      # Same check .githooks/pre-commit runs locally on commits to main --
      # see .githooks/pylint-check.sh.
      - run: .githooks/pylint-check.sh $(git ls-files '*.py')
