[package]
name = "time-tracker"
version = "0.1.0"
edition = "2021"
publish = false
description = "The time-tracking Google Calendar MCP server, ported from Python (see ../README.md)."

[[bin]]
name = "time-tracker-server"
path = "src/main.rs"

[dependencies]
time-tracker-derive = { path = "derive" }
indexmap = { version = "2.2.6", features = ["serde"] }
anyhow = "1.0.86"
axum = "0.8.4"
base64 = "0.22.1"
flate2 = "1.1.2"
futures-core = "0.3.31"
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10.3"
jsonwebtoken = "9.3.1"
regex = "1.11.1"
ureq = { version = "2.12.1", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
sha1 = "0.10.6"
sha2 = "0.10.9"
tokio = { version = "1.46.1", features = ["full"] }
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.6", features = ["fs"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.17.0", features = ["v4", "v5"] }

[profile.release]
debug = false

[dev-dependencies]
rrule = "0.14.0"
