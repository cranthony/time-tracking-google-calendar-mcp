services:
  - type: web
    name: time-tracking-google-calendar-mcp
    runtime: python
    plan: starter
    buildCommand: bash scripts/render-build.sh
    startCommand: bash scripts/render-start.sh
    healthCheckPath: /.well-known/oauth-protected-resource/mcp
    envVars:
      - key: MCP_TRANSPORT
        value: streamable-http
      - key: GOOGLE_CALENDAR_ID
        sync: false
      - key: GOOGLE_OAUTH_CREDENTIALS_PATH
        value: /etc/secrets/credentials.json
      - key: GOOGLE_OAUTH_TOKEN_PATH
        value: /etc/secrets/token.json
      - key: WORKOS_AUTHKIT_DOMAIN
        sync: false
      - key: MCP_ALLOWED_USER_IDS
        sync: false
      # Seals the web app's sign-in cookie (see the README's "Keeping the
      # web app signed in"): random, generated once; a new value signs
      # every browser out.
      - key: SESSION_SECRET
        generateValue: true

# This blueprint covers the build/start command and plain env vars only.
# Two things still need to be done by hand in the Render dashboard after
# the first deploy -- see the README's "Deploying" section:
#   - Secret Files credentials.json/token.json (Render's Blueprint spec has
#     no way to declare Secret File *contents*, by design).
#   - The WorkOS AuthKit project itself (this repo has no WorkOS account to
#     provision one from).
